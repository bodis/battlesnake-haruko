[project]
name = "rl"
version = "0.1.0"
description = "Reinforcement learning training pipeline for Battlesnake Haruko"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "tensorboard>=2.15",
    "numpy>=1.24",
    "flask>=3.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "sb3-contrib>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["env", "model", "training", "inference", "proto"]
